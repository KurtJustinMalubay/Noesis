<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const themeModes = {
          daylight: "light",
          "mica-dark": "dark",
          "warm-paper": "light",
          "nordic-frost": "light",
          "sage-studio": "light",
          "midnight-dusk": "dark",
          tako: "dark",
          "nord-night": "dark",
          "catppuccin-mocha": "dark",
          "tokyo-night": "dark",
          "amoled-obsidian": "dark",
          "strawberry-daiquiri": "light",
          "lavender-mist": "light",
          "teal-turquoise": "light",
          "catppuccin-latte": "light",
        };
        const fonts = new Set([
          "system",
          "geometric",
          "editorial",
          "hyperlegible",
          "monospace",
        ]);
        const readingScales = new Set([
          "compact",
          "default",
          "comfortable",
        ]);
        const root = document.documentElement;
        let theme = "daylight";
        let font = "system";
        let readingScale = "default";
        try {
          const preferences = JSON.parse(
            localStorage.getItem("noesis.preferences.v1") || "null"
          );
          const mode =
            preferences?.appearanceMode === "dark" ||
            preferences?.appearanceMode === "light"
              ? preferences.appearanceMode
              : themeModes[preferences?.theme] || "light";
          const fallbackTheme =
            mode === "dark" ? "mica-dark" : "daylight";
          const lastTheme =
            mode === "dark"
              ? preferences?.lastDarkThemeId
              : preferences?.lastLightThemeId;
          theme =
            themeModes[preferences?.theme] === mode
              ? preferences.theme
              : themeModes[lastTheme] === mode
                ? lastTheme
                : fallbackTheme;
          if (fonts.has(preferences?.fontFamily)) {
            font = preferences.fontFamily;
          }
          if (readingScales.has(preferences?.readingScale)) {
            readingScale = preferences.readingScale;
          }
        } catch {
          // Use default appearance values when saved preferences are unavailable.
        }
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-font", font);
        root.setAttribute("data-reading-scale", readingScale);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noesis</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
